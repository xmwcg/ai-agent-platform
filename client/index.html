    <!-- 修复 nginx 缺 mime.types：拦截所有 JS 请求，自动修正 Content-Type -->
    <script>
      (function(){
        var origFetch = window.fetch;
        window.fetch = function(input, init) {
          var url = typeof input === 'string' ? input : (input && input.url);
          if (url && url.endsWith('.js')) {
            return origFetch.call(window, input, init).then(function(resp){
              if (resp.ok && resp.headers && resp.headers.get('Content-Type') && !resp.headers.get('Content-Type').includes('javascript')) {
                return resp.blob().then(function(blob){
                  return new Response(blob, {status:resp.status,statusText:resp.statusText,headers:new Headers({'Content-Type':'application/javascript'})});
                });
              }
              return resp;
            });
          }
          return origFetch.call(window, input, init);
        };
      })();
    </script>
