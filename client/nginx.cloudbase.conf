# CloudBase 云托管专用 nginx 配置
# TLS 由云托管接入层终止，容器内只跑 HTTP（80）。
# /api 反代目标通过环境变量 API_UPSTREAM 注入（部署时在云托管服务环境变量里填 server 的访问地址）。
# 默认 ai-platform-server:3000（兼容 docker-compose 直接跑此镜像的场景）。
# 注意：proxy_pass 使用变量时必须声明 resolver；这里用公网 DNS，故 API_UPSTREAM 填 server 的【公网访问地址】最稳。

map $uri $csp_header {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80 default_server;
    server_name _;

    resolver 8.8.8.8 1.1.1.1 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $csp_header always;

    location /api {
        proxy_pass http://$API_UPSTREAM:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 10m;
        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    # HTML - 永远不缓存（SPA 入口，文件名不变）
    location ~* .html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri /index.html;

        # JS/CSS 带 hash，可长期缓存
        location ~* .(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }
}
