<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="brandGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowL">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="200" fill="#FFFFFF" rx="20" filter="url(#shadowL)" />

  <!-- LOGO 图标 -->
  <g transform="translate(80, 100)">
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18"
             fill="none" stroke="url(#iconGradL)" stroke-width="2.5" />
    <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10"
             fill="url(#iconGradL)" opacity="0.12" />
    <polygon points="4,-14 -2,0 6,0 0,14 8,-2 -4,-2"
             fill="url(#iconGradL)" />
    <line x1="36" y1="0" x2="48" y2="0" stroke="#6366F1" stroke-width="2" opacity="0.5" />
    <line x1="-36" y1="0" x2="-48" y2="0" stroke="#6366F1" stroke-width="2" opacity="0.5" />
    <circle cx="48" cy="0" r="3" fill="#8B5CF6" />
    <circle cx="-48" cy="0" r="3" fill="#6366F1" />
    <circle cx="0" cy="-40" r="2" fill="#A78BFA" opacity="0.4" />
    <circle cx="0" cy="40" r="2" fill="#A78BFA" opacity="0.4" />
  </g>

  <!-- 品牌文字 -->
  <text x="150" y="88" font-family="'Inter','SF Pro Display',-apple-system,sans-serif"
        font-size="42" font-weight="700" fill="url(#brandGradL)" letter-spacing="-0.5">
    NexMind
  </text>
  <text x="152" y="118" font-family="'Inter','SF Pro Display',-apple-system,sans-serif"
        font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.5">
    by AIbak
  </text>
  <text x="152" y="146" font-family="'Inter','SF Pro Display',-apple-system,sans-serif"
        font-size="13" font-weight="400" fill="#64748B" letter-spacing="0.3">
    Your AI Nexus. Build Smarter.
  </text>
</svg>
